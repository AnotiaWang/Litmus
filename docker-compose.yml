services:
  app:
    build: .
    image: litmus:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    volumes:
      # 数据库和日志放在宿主机的 ./data，容器重建不丢数据
      - ./data:/app/data
    # 给正在运行的一轮留出收尾时间（与镜像里的 NITRO_SHUTDOWN_TIMEOUT 配合）
    stop_grace_period: 300s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 8000) + '/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
